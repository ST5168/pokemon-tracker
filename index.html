<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sean's Pokémon TCG Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0c12;--s1:#13131e;--s2:#1c1c2a;--s3:#252535;--border:#2e2e45;--yellow:#f5c518;--orange:#e8563f;--teal:#3ecfbe;--purple:#9b7fe8;--blue:#5b9cf6;--green:#3dd68c;--red:#f47068;--text:#eaeaf5;--muted:#7070a0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 0 14px;border-bottom:1px solid var(--border)}.hdr-left{display:flex;flex-direction:column;gap:2px}
.hdr h1{font-family:'Bebas Neue';font-size:34px;letter-spacing:3px;color:var(--yellow);line-height:1}
.hdr p{font-family:'DM Mono';font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;line-height:1.4}
/* Lock screen */
.lockscreen{display:flex;align-items:center;justify-content:center;min-height:80vh}
.lockbox{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:360px;text-align:center}
.lockbox .icon{font-size:48px;margin-bottom:16px}
.lockbox h2{font-family:'Bebas Neue';font-size:28px;letter-spacing:2px;color:var(--yellow);margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:12px;margin-bottom:20px;font-family:'DM Mono'}
.lockbox input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px 16px;font-size:15px;width:100%;text-align:center;letter-spacing:3px;margin-bottom:12px;font-family:'DM Mono'}
.lockbox input:focus{outline:none;border-color:var(--yellow)}
.lockbox input::placeholder{letter-spacing:1px;color:var(--muted)}
.lock-err{color:var(--red);font-family:'DM Mono';font-size:11px;margin-bottom:10px;min-height:16px}
/* Nav */
.nav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;padding-top:4px}
.tab{font-family:'DM Mono';font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:10px 14px;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}.tab.on{color:var(--yellow);border-bottom-color:var(--yellow)}
.cnt{background:var(--s3);border-radius:99px;padding:1px 6px;font-size:9px;color:var(--muted)}
.pane{display:none}.pane.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.y::after{background:var(--yellow)}.kpi.o::after{background:var(--orange)}.kpi.g::after{background:var(--green)}.kpi.t::after{background:var(--teal)}.kpi.p::after{background:var(--purple)}
.kpi-lbl{font-family:'DM Mono';font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.kpi-val{font-family:'Bebas Neue';font-size:26px;line-height:1}
.kpi.y .kpi-val{color:var(--yellow)}.kpi.o .kpi-val{color:var(--orange)}.kpi.g .kpi-val{color:var(--green)}.kpi.t .kpi-val{color:var(--teal)}.kpi.p .kpi-val{color:var(--purple)}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:3px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.bud-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bud-lbl{font-family:'DM Mono';font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.bud-pct{font-family:'Bebas Neue';font-size:20px;color:var(--yellow)}
.track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .8s}
.fill.safe{background:var(--green)}.fill.warn{background:var(--yellow)}.fill.over{background:var(--red)}
.bud-meta{display:flex;justify-content:space-between;margin-top:6px;font-family:'DM Mono';font-size:10px;color:var(--muted)}
.alert{border-radius:8px;padding:10px 14px;font-family:'DM Mono';font-size:11px;margin-bottom:14px;line-height:1.6}
.alert.bad{background:#2a1012;color:var(--red);border:1px solid #5a2020}
.alert.warn{background:#2a2008;color:var(--yellow);border:1px solid #5a4a10}
.alert.ok{background:#0d2018;color:var(--green);border:1px solid #1a4a30}
.alert.info{background:#101828;color:var(--blue);border:1px solid #203060}
.ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.sec-lbl{font-family:'DM Mono';font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.btn{border:none;border-radius:8px;cursor:pointer;transition:opacity .15s;font-family:'Bebas Neue';letter-spacing:1px}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--yellow);color:#0c0c12;padding:10px 20px;font-size:16px}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 16px;font-size:14px}
.btn.ghost:hover{border-color:var(--yellow);color:var(--yellow);opacity:1}
.btn.danger{background:var(--red);color:#fff;padding:4px 10px;font-size:11px;font-family:'DM Mono';text-transform:uppercase;letter-spacing:.5px}
.btn.edit{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;font-size:11px;font-family:'DM Mono';text-transform:uppercase;letter-spacing:.5px}
.btn.edit:hover{border-color:var(--yellow);color:var(--yellow);opacity:1}
.btn.lock{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;font-size:12px;font-family:'DM Mono';text-transform:uppercase;letter-spacing:.5px}
.btn.lock:hover{border-color:var(--red);color:var(--red);opacity:1}
.twrap{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden;overflow-x:auto;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:'DM Mono';font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:left;padding:8px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--s2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.empty{padding:24px;text-align:center;color:var(--muted);font-family:'DM Mono';font-size:11px}
.bdg{display:inline-block;padding:2px 7px;border-radius:99px;font-family:'DM Mono';font-size:9px;text-transform:uppercase}
.bdg.sold{background:#0d2018;color:var(--green);border:1px solid #1a5030}
.bdg.pending{background:#1a1808;color:var(--yellow);border:1px solid #4a3a10}
.bdg.psa10{background:#14102a;color:var(--purple);border:1px solid #3a2870}
.bdg.psa9{background:#101828;color:var(--blue);border:1px solid #203060}
.bdg.cgc{background:#102020;color:var(--teal);border:1px solid #1a5050}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:12px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'Bebas Neue';font-size:20px;letter-spacing:1px;color:var(--yellow)}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.modal-close:hover{color:var(--text);background:var(--s2)}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:12px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.bars{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.brow{display:flex;align-items:center;gap:8px}
.bname{font-size:11px;width:155px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden}
.bfill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-family:'DM Mono';font-size:10px;font-weight:600;color:#0c0c12;min-width:55px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-family:'DM Mono';font-size:11px}
.pill b{font-family:'Bebas Neue';font-size:15px;margin-right:4px}
.mono{font-family:'DM Mono'}
.loading{padding:40px;text-align:center;color:var(--muted);font-family:'DM Mono';font-size:11px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:'DM Mono';font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:10px 12px;font-size:13px;width:100%;font-family:'DM Sans',sans-serif}
input:focus,select:focus{outline:none;border-color:var(--yellow)}
input::placeholder{color:var(--muted)}
select option{background:var(--s1)}
.progress-wrap{margin:12px 0}
.progress-bar-outer{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-bar-inner{height:100%;background:var(--yellow);border-radius:99px;transition:width .3s}
</style>
</head>

      <p>Gotta catch &#39;em all!</p>
    </div>
    <button class="btn lock" id="lockBtn" style="display:none" onclick="lockApp()">🔒 Lock</button>
  </div>

  <!-- Lock screen -->
  <div id="lockScreen" class="lockscreen">

      <div class="icon">⚡</div>

    </nav>
    <div class="pane on" id="pane-dashboard"><div class="loading">Loading...</div></div>

    <div class="pane" id="pane-grading"><div class="loading">Loading...</div></div>
  </div>
</div>

<div class="overlay" id="modal" style="display:none" onclick="closeModal(event)">

    <div class="modal-hdr">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

async function checkAndSeed() {
  const { count } = await sb.from('expenses').select('id',{count:'exact',head:true});
  if (!count || count === 0) await seedData();
  loadAll();
}

async function seedData() {
  const tables = ['expenses','revenue','pikachu','slabs','grading'];
  for (const t of tables) { await sb.from(t).insert(SEED[t]); }
}

// ---- Helpers ----
const fmt=n=>'S$'+Math.abs(+n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmtS=n=>((+n||0)<0?'-':'')+fmt(n);
function badge(s){if(!s)return'';const l=s.toLowerCase();const cls=l.includes('sold')?'sold':l.includes('psa 10')?'psa10':l.includes('psa 9')?'psa9':l.includes('cgc')?'cgc':'pending';return`<span class="bdg ${cls}">${s}</span>`;}
function catColor(c){return c==='Long Term Investment'?'var(--teal)':c==='Pikachu Collection'?'var(--yellow)':c==='Card Grading'?'var(--purple)':'var(--muted)';}
function barChart(entries,maxV){return entries.map(([name,val],i)=>`<div class="brow"><div class="bname" title="${name}">${name}</div><div class="btrack"><div class="bfill" style="width:${(val/maxV*100).toFixed(1)}%;background:${COLORS[i%COLORS.length]}">${fmt(val)}</div></div></div>`).join('');}

// ---- Tabs ----
function switchTab(btn,name){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));btn.classList.add('on');document.getElementById('pane-'+name).classList.add('on');const fns={dashboard:renderDashboard,expenses:renderExpenses,revenue:renderRevenue,pikachu:renderPikachu,slabs:renderSlabs,grading:renderGrading};fns[name]();}

async function loadAll(){const tables=['expenses','revenue','pikachu','slabs','grading'];for(const t of tables){const{count}=await sb.from(t).select('id',{count:'exact',head:true});document.getElementById('cnt-'+t).textContent=count||0;}renderDashboard();}

// ---- Dashboard ----
async function renderDashboard(){
  const el=document.getElementById('pane-dashboard');el.innerHTML='<div class="loading">Loading...</div>';
  const [exp,rev,pik,slab,grad]=await Promise.all([sb.from('expenses').select('*'),sb.from('revenue').select('*'),sb.from('pikachu').select('*'),sb.from('slabs').select('*'),sb.from('grading').select('*')]);
  const expenses=exp.data||[],revenue=rev.data||[],pikachu=pik.data||[],slabs=slab.data||[],grading=grad.data||[];
  const totalExp=expenses.reduce((s,r)=>s+(+r.amount||0),0),totalRev=revenue.filter(r=>(r.status||'').toLowerCase()==='sold').reduce((s,r)=>s+(+r.amount||0),0);
  const pikVal=pikachu.reduce((s,r)=>s+(+r.value||0),0),slabVal=slabs.reduce((s,r)=>s+(+r.value||0),0),gradCost=grading.reduce((s,r)=>s+(+r.total_cost||0),0);
  const netPnL=totalRev+pikVal+slabVal-totalExp;
  const pct=Math.min((totalExp/BUDGET)*100,100);
  const byType={},bySource={},byLang={};
  expenses.forEach(e=>{byType[e.type]=(byType[e.type]||0)+(+e.amount||0);bySource[e.source]=(bySource[e.source]||0)+(+e.amount||0);});
  pikachu.forEach(p=>{byLang[p.language]=(byLang[p.language]||0)+1;});
  const typeE=Object.entries(byType).sort((a,b)=>b[1]-a[1]),srcE=Object.entries(bySource).sort((a,b)=>b[1]-a[1]);
  const maxT=Math.max(...typeE.map(e=>e[1]),1),maxS=Math.max(...srcE.map(e=>e[1]),1);
  const alertHtml=totalExp>BUDGET?`<div class="alert bad">⚠ OVER BUDGET — Spent ${fmt(totalExp)}, exceeding S$800 cap by ${fmt(totalExp-BUDGET)}. Stop non-essential purchases.</div>`:pct>75?`<div class="alert warn">⚠ Budget at ${pct.toFixed(0)}% — ${fmt(BUDGET-totalExp)} remaining.</div>`:`<div class="alert ok">✓ Budget on track — ${fmt(BUDGET-totalExp)} remaining this month.</div>`;
  el.innerHTML=`<div class="kpis"><div class="kpi o"><div class="kpi-lbl">Total Spent</div><div class="kpi-val">${fmt(totalExp)}</div><div class="kpi-sub">${expenses.length} transactions</div></div><div class="kpi g"><div class="kpi-lbl">Total Revenue (Sold)</div><div class="kpi-val">${fmt(totalRev)}</div><div class="kpi-sub">${revenue.filter(r=>(r.status||'').toLowerCase()==='sold').length} sold</div></div><div class="kpi ${netPnL>=0?'g':'o'}"><div class="kpi-lbl">Net P&L</div><div class="kpi-val">${fmtS(netPnL)}</div><div class="kpi-sub">${netPnL>=0?'▲ Profit':'▼ Loss'} · Rev+Pika+Slabs−Spent</div></div><div class="kpi y"><div class="kpi-lbl">Pikachu Collection</div><div class="kpi-val">${fmt(pikVal)}</div><div class="kpi-sub">${pikachu.length} cards</div></div><div class="kpi t"><div class="kpi-lbl">Slab Collection</div><div class="kpi-val">${fmt(slabVal)}</div><div class="kpi-sub">${slabs.length} slabs</div></div><div class="kpi p"><div class="kpi-lbl">Grading Pipeline</div><div class="kpi-val">${grading.length}</div><div class="kpi-sub">${fmt(gradCost)} invested</div></div></div>
  <div class="card"><div class="bud-row"><span class="bud-lbl">Monthly Budget (S$800 cap)</span><span class="bud-pct">${pct.toFixed(0)}%</span></div><div class="track"><div class="fill ${pct>100?'over':pct>75?'warn':'safe'}" style="width:${pct}%"></div></div><div class="bud-meta"><span>Spent: ${fmt(totalExp)}</span><span>Cap: S$800/mo</span></div></div>
  ${alertHtml}
  <div class="two"><div><div class="sec-lbl">Spend by Type</div><div class="bars">${typeE.length?barChart(typeE,maxT):'<p style="color:var(--muted);font-size:11px">No data.</p>'}</div></div><div><div class="sec-lbl">Spend by Source</div><div class="bars">${srcE.length?barChart(srcE,maxS):'<p style="color:var(--muted);font-size:11px">No data.</p>'}</div></div></div>
  ${Object.keys(byLang).length?`<div class="sec-lbl">Pikachu by Language</div><div class="pills">${Object.entries(byLang).sort((a,b)=>b[1]-a[1]).map(([l,c])=>`<div class="pill"><b>${c}</b>${l}</div>`).join('')}<div class="pill" style="border-color:var(--yellow);color:var(--yellow)"><b>${fmt(pikVal)}</b>est. value</div></div>`:''}
  <div class="sec-lbl" style="margin-top:8px">Quick Add</div>
  <div class="pills"><button class="btn ghost" onclick="switchTab(document.querySelectorAll('.tab')[1],'expenses');setTimeout(()=>openModal('expenses'),100)">+ Expense</button><button class="btn ghost" onclick="switchTab(document.querySelectorAll('.tab')[2],'revenue');setTimeout(()=>openModal('revenue'),100)">+ Sale</button><button class="btn ghost" onclick="switchTab(document.querySelectorAll('.tab')[3],'pikachu');setTimeout(()=>openModal('pikachu'),100)">+ Pikachu Card</button><button class="btn ghost" onclick="switchTab(document.querySelectorAll('.tab')[4],'slabs');setTimeout(()=>openModal('slabs'),100)">+ Slab</button><button class="btn ghost" onclick="switchTab(document.querySelectorAll('.tab')[5],'grading');setTimeout(()=>openModal('grading'),100)">+ Grading</button></div>`;
}

async function renderPikachu(){const el=document.getElementById('pane-pikachu');el.innerHTML='<div class="loading">Loading...</div>';const{data}=await sb.from('pikachu').select('*').order('created_at',{ascending:true});const rows=data||[];const total=rows.reduce((s,r)=>s+(+r.value||0),0);const byLang={};rows.forEach(r=>{byLang[r.language]=(byLang[r.language]||0)+1;});el.innerHTML=`<div class="ph"><div><div class="sec-lbl">Pikachu Collection</div><div style="font-family:'Bebas Neue';font-size:22px;color:var(--yellow)">${rows.length} cards · ${fmt(total)}</div></div><button class="btn primary" onclick="openModal('pikachu')">+ ADD CARD</button></div><div class="pills">${Object.entries(byLang).sort((a,b)=>b[1]-a[1]).map(([l,c])=>`<div class="pill"><b>${c}</b>${l}</div>`).join('')}</div><div class="twrap"><table><thead><tr><th>#</th><th>Card Name</th><th>Number</th><th>Language</th><th>Est. Value</th><th></th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td class="mono" style="color:var(--muted)">${i+1}</td><td>${r.name||''}</td><td class="mono" style="font-size:11px;color:var(--muted)">${r.number||''}</td><td style="font-size:10px;color:var(--muted)">${r.language||''}</td><td class="mono" style="color:var(--yellow)">${fmt(r.value)}</td><td><div style="display:flex;gap:5px"><button class="btn edit" onclick='editRow("pikachu",${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button><button class="btn danger" onclick="delRow('pikachu','${r.id}',renderPikachu)">Del</button></div></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No Pikachu cards yet.</div></td></tr>`}</tbody></table></div>`;}

// ---- Slabs ----
async function renderSlabs(){const el=document.getElementById('pane-slabs');el.innerHTML='<div class="loading">Loading...</div>';const{data}=await sb.from('slabs').select('*').order('value',{ascending:false});const rows=data||[];const total=rows.reduce((s,r)=>s+(+r.value||0),0);el.innerHTML=`<div class="ph"><div><div class="sec-lbl">Slab Collection</div><div style="font-family:'Bebas Neue';font-size:22px;color:var(--teal)">${rows.length} slabs · ${fmt(total)}</div></div><button class="btn primary" onclick="openModal('slabs')">+ ADD SLAB</button></div><div class="twrap"><table><thead><tr><th>Card Name</th><th>Language</th><th>Grade</th><th>Est. Value</th><th></th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${r.name||''}</td><td style="font-size:10px;color:var(--muted)">${r.language||''}</td><td>${badge(r.grade)}</td><td class="mono" style="color:var(--teal)">${fmt(r.value)}</td><td><div style="display:flex;gap:5px"><button class="btn edit" onclick='editRow("slabs",${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button><button class="btn danger" onclick="delRow('slabs','${r.id}',renderSlabs)">Del</button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No slabs yet.</div></td></tr>`}</tbody></table></div>`;}

// ---- Grading ----
async function renderGrading(){const el=document.getElementById('pane-grading');el.innerHTML='<div class="loading">Loading...</div>';const{data}=await sb.from('grading').select('*').order('submitted',{ascending:false});const rows=data||[];const totalRawCost=rows.reduce((s,r)=>s+(+r.raw_cost||0),0);
  const totalGradingFees=rows.reduce((s,r)=>s+(+r.grading_cost||0),0);
  const totalCost=rows.reduce((s,r)=>s+(+r.total_cost||0),0);
  const totalGradedValue=rows.reduce((s,r)=>s+(+r.graded_value||0),0);
  const totalPnL=totalGradedValue-totalCost;
  const pending=rows.filter(r=>r.actual_grade==='Pending'||!r.actual_grade).length;
  el.innerHTML=`<div class="ph"><div><div class="sec-lbl">Card Grading Pipeline</div><div style="font-family:'Bebas Neue';font-size:22px;color:var(--purple)">${rows.length} cards · ${pending} pending</div></div><button class="btn primary" onclick="openModal('grading')">+ SEND FOR GRADING</button></div>
  <div class="pills">
    <div class="pill"><span style="color:var(--muted);font-size:9px;display:block;margin-bottom:2px">RAW COST</span><b style="font-family:'Bebas Neue';font-size:16px;color:var(--orange)">${fmt(totalRawCost)}</b></div>
    <div class="pill"><span style="color:var(--muted);font-size:9px;display:block;margin-bottom:2px">GRADING FEES</span><b style="font-family:'Bebas Neue';font-size:16px;color:var(--orange)">${fmt(totalGradingFees)}</b></div>
    <div class="pill"><span style="color:var(--muted);font-size:9px;display:block;margin-bottom:2px">TOTAL INVESTED</span><b style="font-family:'Bebas Neue';font-size:16px;color:var(--orange)">${fmt(totalCost)}</b></div>
    <div class="pill"><span style="color:var(--muted);font-size:9px;display:block;margin-bottom:2px">GRADED VALUE</span><b style="font-family:'Bebas Neue';font-size:16px;color:var(--teal)">${fmt(totalGradedValue)}</b></div>
    <div class="pill"><span style="color:var(--muted);font-size:9px;display:block;margin-bottom:2px">NET P&L</span><b style="font-family:'Bebas Neue';font-size:16px;color:${totalPnL>=0?'var(--green)':'var(--red)'}">${fmtS(totalPnL)}</b></div>
  </div>${pending>0?`<div class="alert warn">⏳ ${pending} card${pending>1?'s':''} pending. Check PSA/CGC tracking portal.</div>`:''}<div class="twrap"><table><thead><tr><th>Card</th><th>Self Grade</th><th>Submitted</th><th>Raw Cost</th><th>Fee</th><th>Total</th><th>Result</th><th>Graded Value</th><th>P&L</th><th></th></tr></thead><tbody>${rows.length?rows.map(r=>{const pnl=(+r.graded_value||0)-(+r.total_cost||0);return`<tr><td style="max-width:140px;overflow:hidden;text-overflow:ellipsis">${r.name||''}</td><td>${badge(r.self_grade)}</td><td class="mono" style="font-size:11px;color:var(--muted)">${r.submitted||''}</td><td class="mono">${r.raw_cost?fmt(r.raw_cost):'—'}</td><td class="mono">${fmt(r.grading_cost)}</td><td class="mono" style="color:var(--orange)">${fmt(r.total_cost)}</td><td>${badge(r.actual_grade||'Pending')}</td><td class="mono" style="color:var(--teal)">${r.graded_value?fmt(r.graded_value):'—'}</td><td class="mono" style="color:${pnl>=0?'var(--green)':'var(--red)'}">${r.graded_value?fmtS(pnl):'—'}</td><td><div style="display:flex;gap:5px"><button class="btn edit" onclick='editRow("grading",${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button><button class="btn danger" onclick="delRow('grading','${r.id}',renderGrading)">Del</button></div></td></tr>`;}).join(''):`<tr><td colspan="10"><div class="empty">No grading entries yet.</div></td></tr>`}</tbody></table></div>`;}

// ---- Modal ----
const FORM_CONFIGS={expenses:{title:'Add Expense',editTitle:'Edit Expense',fields:[{key:'date',label:'Date *',type:'date'},{key:'type',label:'Purchase Type',type:'select',opts:['Sealed packs','Single Card Purchase','Livestream','Slab Purchase','Pikachu Tohoku Box','Pikachu Hiroshima Box','Pikachu Fukuoka Box','Other (custom...)']},{key:'source',label:'Source',type:'select',opts:['Play United','DXCollection','Inferno Gaming','Card Collectible','Cardboard Collectible','Roadshow','Livestream','Wobufei','Buyee','Carousell','Facebook Group','Other (custom...)']},{key:'amount',label:'Amount (S$) *',type:'number',placeholder:'0.00'},{key:'hits',label:'Hits / Card Name',type:'text',placeholder:'e.g. Mega Gengar EX 284/217'},{key:'category',label:'Category',type:'select',opts:['Not Applicable','Pikachu Collection','Long Term Investment','Card Grading','Resell','Other (custom...)']},{key:'notes',label:'Notes',type:'text',placeholder:'Optional'}],required:['date','amount'],table:'expenses',refresh:renderExpenses},revenue:{title:'Log Sale',editTitle:'Edit Sale',fields:[{key:'item',label:'Item Name *',type:'text',placeholder:'e.g. Mega Gengar EX'},{key:'amount',label:'Amount (S$) *',type:'number',placeholder:'0.00'},{key:'date',label:'Date *',type:'date'},{key:'status',label:'Status',type:'select',opts:['Sold','Pending','Reserved']}],required:['item','amount','date'],table:'revenue',refresh:renderRevenue},pikachu:{title:'Add Pikachu Card',editTitle:'Edit Card',fields:[{key:'name',label:'Card Name *',type:'text',placeholder:'e.g. Pikachu Ex RR'},{key:'number',label:'Card Number',type:'text',placeholder:'e.g. 044/193'},{key:'language',label:'Language',type:'select',opts:['English','Japanese','Chinese','Thailand','Korean','Other']},{key:'value',label:'Est. Value (S$)',type:'number',placeholder:'0.00'},{key:'notes',label:'Notes',type:'text',placeholder:'Optional'}],required:['name'],table:'pikachu',refresh:renderPikachu},slabs:{title:'Add Slab',editTitle:'Edit Slab',fields:[{key:'name',label:'Card Name *',type:'text',placeholder:'e.g. 1999 Pikachu Base Set #58'},{key:'language',label:'Language',type:'select',opts:['Japanese','English','Chinese','Korean','Other']},{key:'grade',label:'Grade',type:'select',opts:['PSA 10','PSA 9','PSA 8','PSA 7','CGC 10','CGC 9.5','CGC 9.0','CGC 8.5','BGS 10','BGS 9.5','Other']},{key:'value',label:'Est. Value (S$)',type:'number',placeholder:'0.00'},{key:'notes',label:'Notes',type:'text',placeholder:'Optional'}],required:['name'],table:'slabs',refresh:renderSlabs},grading:{title:'Send for Grading',editTitle:'Edit Grading Entry',fields:[{key:'name',label:'Card Name *',type:'text',placeholder:'e.g. Pikachu 160/159 (English)'},{key:'self_grade',label:'Self Assessment',type:'select',opts:['PSA 10','PSA 9','PSA 8','CGC 10','CGC 9.5','CGC 9.0']},{key:'submitted',label:'Submission Date',type:'date'},{key:'raw_cost',label:'Raw Card Cost (S$)',type:'number',placeholder:'0.00'},{key:'grading_cost',label:'Grading Fee (S$)',type:'number',placeholder:'40.625'},{key:'actual_grade',label:'Actual Result',type:'select',opts:['Pending','PSA 10','PSA 9','PSA 8','PSA 7','CGC 10','CGC 9.5','CGC 9.0','CGC 8.5']},{key:'result_date',label:'Result Date',type:'date'},{key:'graded_value',label:'Graded Card Value (S$)',type:'number',placeholder:'0.00'}],required:['name'],table:'grading',refresh:renderGrading}};

function handleCustomSelect(sel, key) {
  const customInput = document.getElementById('f_' + key + '_custom');
  if (customInput) {
    customInput.style.display = sel.value === 'Other (custom...)' ? 'block' : 'none';
    if (sel.value !== 'Other (custom...)') customInput.value = '';
  }
}

function openModal(tableKey,data=null){const cfg=FORM_CONFIGS[tableKey];currentTable=tableKey;currentEdit=data?data.id:null;document.getElementById('modalTitle').textContent=data?cfg.editTitle:cfg.title;const today=new Date().toISOString().split('T')[0];const defaults={date:today,submitted:today,type:'Sealed packs',source:'Play United',category:'Not Applicable',status:'Sold',actual_grade:'Pending',language:tableKey==='pikachu'?'English':'Japanese',grade:'PSA 10',self_grade:'PSA 10',grading_cost:'40.625'};document.getElementById('modalBody').innerHTML=cfg.fields.map(f=>{const val=data?(f.key==='submitted'||f.key==='result_date'||f.key==='date'?((data[f.key]||'').split('T')[0]):data[f.key]??''):(defaults[f.key]||'');if(f.type==='select'){const hasCustom=f.opts.includes('Other (custom...)');return`<div class="field"><label>${f.label}</label><select id="f_${f.key}" onchange="handleCustomSelect(this,'${f.key}')">${f.opts.map(o=>`<option${o==val?' selected':''}>${o}</option>`).join('')}</select>${hasCustom?`<input type="text" id="f_${f.key}_custom" placeholder="Type custom value..." style="display:${val&&!f.opts.includes(val)&&val!==''?'block':'none'};margin-top:6px" value="${val&&!f.opts.includes(val)?val:''}">`:''}`;+`</div>`;}return`<div class="field"><label>${f.label}</label><input id="f_${f.key}" type="${f.type}" placeholder="${f.placeholder||''}" value="${val}" ${f.type==='number'?'step="0.01"':''}></div>`;}).join('')+`<div id="modalError" class="alert bad" style="display:none"></div><div class="modal-footer"><button class="btn ghost" onclick="closeModal()">CANCEL</button><button class="btn primary" onclick="saveModal('${tableKey}')">SAVE</button></div>`;document.getElementById('modal').style.display='flex';}
function editRow(tableKey,data){openModal(tableKey,data);}
function closeModal(e){if(e&&e.target!==document.getElementById('modal'))return;document.getElementById('modal').style.display='none';}
async function saveModal(tableKey){const cfg=FORM_CONFIGS[tableKey];const payload={};cfg.fields.forEach(f=>{const el=document.getElementById('f_'+f.key);if(f.type==='number'){payload[f.key]=parseFloat(el.value)||0;}else if(f.type==='select'&&el.value==='Other (custom...)'){const custom=document.getElementById('f_'+f.key+'_custom');payload[f.key]=custom&&custom.value.trim()?custom.value.trim():'Other';}else{payload[f.key]=el.value;}});for(const req of cfg.required){if(!payload[req]&&payload[req]!==0){const e=document.getElementById('modalError');e.textContent=req+' is required.';e.style.display='block';return;}}if(tableKey==='grading'){payload.total_cost=(payload.raw_cost||0)+(payload.grading_cost||0);payload.pnl=(payload.graded_value||0)-payload.total_cost;if(!payload.result_date)payload.result_date=null;}if(currentEdit){await sb.from(cfg.table).update(payload).eq('id',currentEdit);}else{await sb.from(cfg.table).insert(payload);}document.getElementById('modal').style.display='none';cfg.refresh();loadAll();}
async function delRow(table,id,refreshFn){if(!confirm('Delete this entry?'))return;await sb.from(table).delete().eq('id',id);refreshFn();loadAll();}
</script>
